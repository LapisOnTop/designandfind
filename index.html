<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    window.onerror = function (msg, url, line, col, error) {
      document.body.innerHTML = "<div style='color:red;font-size:18px;padding:20px;background:white;position:absolute;z-index:99999;width:100%;height:100%;top:0;left:0;'><h1>GLOBAL ERROR: " + msg + "</h1><pre>" + (error ? error.stack : "") + "</pre></div>";
    };
    window.addEventListener("unhandledrejection", function (e) {
      document.body.innerHTML = "<div style='color:red;font-size:18px;padding:20px;background:white;position:absolute;z-index:99999;width:100%;height:100%;top:0;left:0;'><h1>PROMISE REJECTION</h1><pre>" + (e.reason ? e.reason.stack || e.reason : "") + "</pre></div>";
    });
  </script>
  <!-- TODO: Set the document title to the name of your application -->
  <title>DesignMatch</title>
  <meta name="description" content="DesignMatch Project" />
  <meta name="author" content="DesignMatch" />

  <!-- TODO: Update og:title to match your application name -->
  <meta property="og:title" content="DesignMatch" />
  <meta property="og:description" content="DesignMatch Project" />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/favicon.svg" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:site" content="@DesignMatch" />
  <meta name="twitter:image" content="/favicon.svg" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
